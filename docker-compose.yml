services:
  # 1. PostgreSQL Database (Ultra-Lightweight Alpine)
  db:
    image: postgres:16-alpine
    container_name: serphawk_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serphawk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serphawk_pass}
      POSTGRES_DB: ${POSTGRES_DB:-serphawk_crm}
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=4MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serphawk} -d ${POSTGRES_DB:-serphawk_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: serphawk_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-serphawk}:${POSTGRES_PASSWORD:-serphawk_pass}@db:5432/${POSTGRES_DB:-serphawk_crm}
      SECRET_KEY: ${SECRET_KEY:-default_secret_key_change_in_prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 96M

  # 3. Next.js 16 Standalone Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: serphawk_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 96M

  # 4. Nginx Reverse Proxy (Single Entry Point on Port 80)
  nginx:
    image: nginx:alpine
    container_name: serphawk_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          memory: 16M

volumes:
  postgres_data:
